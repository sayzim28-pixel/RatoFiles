name: Gerar IPA do RatoFiles

on:
  push:
    branches: [main, master, principal]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Compilar app iOS
        run: |
          set -euo pipefail

          xcodebuild build \
            -project RatoFiles.xcodeproj \
            -scheme RatoFiles \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Criar IPA
        run: |
          set -euo pipefail

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RatoFiles.app Payload/RatoFiles.app

          cd Payload
          zip -qry ../RatoFiles.ipa RatoFiles.app
          cd ..

          test -f RatoFiles.ipa
          unzip -l RatoFiles.ipa

      - name: Enviar IPA para baixar
        uses: actions/upload-artifact@v4
        with:
          name: RatoFiles-IPA
          path: RatoFiles.ipa
          if-no-files-found: error
