name: Build RatoFiles IPA

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app

    - name: Build iOS App (.app)
      run: |
        xcodebuild -project RatoFiles.xcodeproj \
                   -scheme RatoFiles \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build

    - name: Create Payload and IPA
      run: |
        mkdir -p Payload
        APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "RatoFiles.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          APP_PATH=$(find build -name "RatoFiles.app" -type d | head -n 1)
        fi
        
        if [ -n "$APP_PATH" ]; then
          echo "App encontrado em: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r RatoFiles.ipa Payload/
        else
          echo "Erro: RatoFiles.app não encontrado."
          exit 1
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RatoFiles-IPA
        path: RatoFiles.ipa
