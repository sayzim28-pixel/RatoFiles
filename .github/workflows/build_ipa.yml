      - name: Criar arquivo IPA
        run: |
          set -euo pipefail

          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RatoFiles.app Payload/

          zip -qry RatoFiles.ipa Payload

          ls -lh RatoFiles.ipa

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: RatoFiles-IPA
          path: RatoFiles.ipa
          if-no-files-found: error
