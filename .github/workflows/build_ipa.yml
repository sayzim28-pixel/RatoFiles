name: Build RatoFiles IPA

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Compile and Package iOS App
      run: |
        echo "Criando estrutura do App..."
        mkdir -p Payload/RatoFiles.app

        echo "Compilando arquivos Swift para iOS..."
        xcrun swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                     -target arm64-apple-ios15.0 \
                     -parse-as-library \
                     RatoFiles/AppDelegate.swift \
                     RatoFiles/MainViewController.swift \
                     -o Payload/RatoFiles.app/RatoFiles

        echo "Copiando Info.plist..."
        cp RatoFiles/Info.plist Payload/RatoFiles.app/Info.plist

        echo "Compactando em IPA..."
        zip -r RatoFiles.ipa Payload

        echo "IPA gerado com sucesso!"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RatoFiles-IPA
        path: RatoFiles.ipa
